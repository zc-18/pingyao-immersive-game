limit_conn_zone $binary_remote_addr zone=pingyao_perip:256k;
limit_conn_zone $server_name zone=pingyao_total:64k;

server {
    listen 9830;
    server_name pingyao_game;
    root /www/wwwroot/pingyao-game/current;
    index index.html;

    limit_conn pingyao_perip 12;
    limit_conn pingyao_total 64;
    limit_conn_status 429;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    limit_rate_after 2m;
    limit_rate 1m;
    autoindex off;
    access_log off;
    error_log /www/wwwlogs/pingyao-game.error.log crit;
    gzip off;
    gzip_static on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\. { deny all; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }
    location /static/ {
        expires 1h;
        try_files $uri =404;
    }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;
    }
}
